{% load static %}
<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Financial One</title>
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            /* Light Theme */
            --bg-background: #f9fafb;
            --bg-surface: #ffffff;
            --bg-card-hover: #f3f4f6;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --primary-color: #0d7ff2;
        }

        .dark {
            /* Dark Theme */
            --bg-background: #101922;
            --bg-surface: #1b2733;
            --bg-card-hover: #223649;
            --text-primary: #ffffff;
            --text-secondary: #90adcb;
            --border-color: #223649;
            --primary-color: #0d7ff2;
        }

        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .material-symbols-outlined {
            font-size: 24px;
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: 'var(--bg-background)',
                        surface: 'var(--bg-surface)',
                        'card-hover': 'var(--bg-card-hover)',
                        border: 'var(--border-color)',
                        primary: 'var(--primary-color)',
                        'text-main': 'var(--text-primary)',
                        'text-muted': 'var(--text-secondary)',
                    }
                }
            }
        }

        // Apply theme from local storage
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>

<body class="flex items-center justify-center min-h-screen bg-background p-4">
    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="flex flex-col items-center mb-8">
            <div class="bg-primary/20 flex items-center justify-center rounded-xl w-16 h-16 text-primary mb-4">
                <span class="material-symbols-outlined text-4xl">all_inclusive</span>
            </div>
            <h1 class="text-2xl font-bold text-text-main">Financial One</h1>
            <p class="text-text-muted text-sm mt-1">Your Personal Finance Manager</p>
        </div>

        <!-- Login Form -->
        <div class="bg-surface border border-border rounded-2xl p-8 shadow-xl">
            <h2 class="text-xl font-bold text-text-main mb-2">Welcome Back</h2>
            <form method="POST" class="flex flex-col gap-5">
                {% csrf_token %}

                {% if form.non_field_errors %}
                <div class="bg-red-500/10 border border-red-500/20 text-red-400 p-3 rounded-md text-sm">
                    {{ form.non_field_errors|join:", " }}
                </div>
                {% endif %}

                <div class="flex flex-col gap-2">
                    <label for="id_username" class="text-text-muted text-sm">Email</label>
                    <input type="text" name="username" id="id_username" placeholder="you@example.com" required
                        class="bg-background border border-border text-text-main placeholder:text-text-muted focus:border-primary rounded-md p-2 w-full">
                </div>

                <div class="flex flex-col gap-2">
                    <div class="flex justify-between items-center">
                        <label for="id_password" class="text-text-muted text-sm">Password</label>
                        <a href="{% url 'password_reset' %}" class="text-primary hover:underline text-xs">Forgot
                            password?</a>
                    </div>
                    <input type="password" name="password" id="id_password" placeholder="••••••••" required
                        class="bg-background border border-border text-text-main placeholder:text-text-muted focus:border-primary rounded-md p-2 w-full">
                </div>

                <button type="submit"
                    class="w-full bg-primary hover:bg-blue-600 text-white font-medium py-2.5 mt-2 rounded-md transition-colors flex items-center justify-center">
                    Sign In
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-text-muted text-sm">
                    Don't have an account?
                    <a href="{% url 'register' %}" class="text-primary hover:underline font-medium">Create one</a>
                </p>
            </div>
        </div>
    </div>
</body>

</html>
