{% load static %}
<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Financial One</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #101922;
            color: white;
        }

        .material-symbols-outlined {
            font-size: 24px;
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen bg-[#101922] p-4">
    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="flex flex-col items-center mb-8">
            <div class="bg-[#0d7ff2]/20 flex items-center justify-center rounded-xl w-16 h-16 text-[#0d7ff2] mb-4">
                <span class="material-symbols-outlined text-4xl">all_inclusive</span>
            </div>
            <h1 class="text-2xl font-bold text-white">Financial One</h1>
            <p class="text-[#90adcb] text-sm mt-1">Your Personal Finance Manager</p>
        </div>

        <!-- Login Form -->
        <div class="bg-[#1b2733] border border-[#223649] rounded-2xl p-8 shadow-xl">
            <h2 class="text-xl font-bold text-white mb-2">Welcome Back</h2>
            <form method="POST" class="flex flex-col gap-5">
                {% csrf_token %}

                {% if form.non_field_errors %}
                <div class="bg-red-500/10 border border-red-500/20 text-red-400 p-3 rounded-md text-sm">
                    {{ form.non_field_errors|join:", " }}
                </div>
                {% endif %}

                <div class="flex flex-col gap-2">
                    <label for="id_username" class="text-[#90adcb] text-sm">Email</label>
                    <input type="text" name="username" id="id_username" placeholder="you@example.com" required
                        class="bg-[#101922] border border-[#223649] text-white placeholder:text-[#586e82] focus:border-[#0d7ff2] rounded-md p-2 w-full">
                </div>

                <div class="flex flex-col gap-2">
                    <label for="id_password" class="text-[#90adcb] text-sm">Password</label>
                    <input type="password" name="password" id="id_password" placeholder="••••••••" required
                        class="bg-[#101922] border border-[#223649] text-white placeholder:text-[#586e82] focus:border-[#0d7ff2] rounded-md p-2 w-full">
                </div>

                <button type="submit"
                    class="w-full bg-[#0d7ff2] hover:bg-blue-600 text-white font-medium py-2.5 mt-2 rounded-md transition-colors flex items-center justify-center">
                    Sign In
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-[#90adcb] text-sm">
                    Don't have an account?
                    <a href="{% url 'register' %}" class="text-[#0d7ff2] hover:underline font-medium">Create one</a>
                </p>
            </div>
        </div>
    </div>
</body>

</html>
