{% load static %}
<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete - Financial One</title>
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #101922;
            color: white;
        }

        .material-symbols-outlined {
            font-size: 24px;
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen bg-[#101922] p-4">
    <div class="w-full max-w-md">
        <div class="flex flex-col items-center mb-8">
            <div class="bg-green-500/20 flex items-center justify-center rounded-xl w-16 h-16 text-green-500 mb-4">
                <span class="material-symbols-outlined text-4xl">check_circle</span>
            </div>
            <h1 class="text-2xl font-bold text-white">Password Reset!</h1>
        </div>

        <div class="bg-[#1b2733] border border-[#223649] rounded-2xl p-8 shadow-xl text-center">
            <p class="text-[#90adcb] mb-6">
                Your password has been set. You may go ahead and log in now.
            </p>

            <a href="{% url 'login' %}"
                class="inline-block w-full bg-[#0d7ff2] hover:bg-blue-600 text-white font-medium py-2.5 rounded-md transition-colors">
                Log In
            </a>
        </div>
    </div>
</body>

</html>
