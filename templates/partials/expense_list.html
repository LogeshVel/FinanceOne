{% load humanize %}
{% for expense in expenses %}
<tr class="border-b border-border hover:bg-card-hover cursor-pointer group transition-colors">
    <td class="p-4">
        <div class="flex items-center">
            <div class="w-10 h-10 bg-card-hover rounded-full flex items-center justify-center text-text-muted">
                <span class="material-symbols-outlined text-lg">receipt_long</span>
            </div>
            <div class="ml-4">
                <div class="text-sm font-medium text-text-main">{{ expense.description }}</div>
            </div>
        </div>
    </td>
    <td class="p-4">
        <span
            class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-card-hover text-text-muted">
            {{ expense.category }}
        </span>
    </td>
    <td class="p-4 text-sm text-text-muted">
        {{ expense.date }}
    </td>
    <td class="p-4 text-right text-sm font-bold text-text-main">
        -₹{{ expense.amount|intcomma }}
    </td>
    <td class="p-4 text-center">
        <a href="{% url 'delete_expense' expense.id %}"
            onclick="return confirm('Are you sure you want to delete this expense?')"
            class="text-red-500 hover:text-red-400 transition-colors">
            <span class="material-symbols-outlined text-[20px]">delete</span>
        </a>
    </td>
</tr>
{% empty %}
<tr>
    <td colspan="4" class="p-8 text-center text-text-muted">No expenses found</td>
</tr>
{% endfor %}
