{% load humanize %}
{% for loan in loans %}
<tr class="border-b border-border hover:bg-card-hover transition-colors">
    <td class="p-4 text-text-main font-medium">{{ loan.lender_name }}</td>
    <td class="p-4">
        <span
            class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-card-hover text-text-muted">
            {{ loan.loan_type }}
        </span>
    </td>
    <td class="p-4 text-sm text-text-muted">
        {{ loan.interest_rate }}% • {{ loan.tenure }} Years
    </td>
    <td class="p-4 text-right text-sm font-bold text-orange-400">
        ₹{{ loan.calculated_emi|intcomma }}
    </td>
    <td class="p-4 text-right text-sm font-bold text-red-400">
        ₹{{ loan.outstanding_amount|intcomma }}
    </td>
    <td class="p-4 text-right text-sm font-bold text-text-muted">
        ₹{{ loan.amount|intcomma }}
    </td>
    <td class="p-4 text-center">
        <a href="{% url 'delete_loan' loan.id %}" onclick="return confirm('Are you sure you want to delete this loan?')"
            class="text-red-500 hover:text-red-400 transition-colors">
            <span class="material-symbols-outlined text-[20px]">delete</span>
        </a>
    </td>
</tr>
{% empty %}
<tr>
    <td colspan="7" class="p-8 text-center text-text-muted">No loans found</td>
</tr>
{% endfor %}
